name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  required-ci:
    name: Required CI
    needs: node-22-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check out pinned OpenCode gateway protocol source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: roymejia2217/chatgpt-opencode-mcp
          ref: 0176b5780a7037d5637b7e75ff1a650fae386570
          path: .gateway-contract-source
          persist-credentials: false

      - name: Validate cross-repository OpenCode MCP tool contract
        env:
          JDC_GATEWAY_CHECKOUT: .gateway-contract-source
        run: node --test test/contracts/gateway-surface.test.js

      - name: Validate repository squash defaults
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const result = await github.graphql(
              `query RepositoryMergeSettings($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  squashMergeAllowed
                  mergeCommitAllowed
                  rebaseMergeAllowed
                  squashMergeCommitTitle
                  squashMergeCommitMessage
                }
              }`,
              {
                owner: context.repo.owner,
                name: context.repo.repo,
              },
            );
            const repository = result.repository;
            const expected = {
              squashMergeAllowed: true,
              mergeCommitAllowed: false,
              rebaseMergeAllowed: false,
              squashMergeCommitTitle: 'PR_TITLE',
              squashMergeCommitMessage: 'BLANK',
            };

            for (const [key, value] of Object.entries(expected)) {
              if (repository[key] !== value) {
                core.setFailed(
                  `Repository setting ${key} must be ${JSON.stringify(value)}; ` +
                    `received ${JSON.stringify(repository[key])}.`,
                );
              }
            }

      - name: Validate prospective squash commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run --silent lint:commit

      - name: Validate protected-branch commit
        if: github.event_name == 'push'
        run: >-
          npm run --silent lint:commit --
          --from HEAD~1
          --to HEAD
          --verbose

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint GitHub Actions
        run: ./actionlint -color

      - name: Enforce Standard Readme and remark-lint
        run: npm run lint:readme

      - name: Check README links
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --no-progress --root-dir . README.md

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Run repository verification
        run: npm run verify

      - name: Verify npm package contents
        run: npm pack --dry-run

  node-22-minimum:
    name: Node 22.19 Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up minimum supported Node.js 22.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify minimum supported Node.js runtime
        run: npm run verify

  windows-ui-bridge:
    name: Windows UI Bridge
    runs-on: windows-2025
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    defaults:
      run:
        working-directory: companion/windows-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: companion/windows-ui/global.json

      - name: Restore locked UI bridge dependencies
        run: dotnet restore .\DesktopCommander.UiBridge\DesktopCommander.UiBridge.csproj --locked-mode

      - name: Publish Windows UI bridge
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'jdc-ui-bridge'
          dotnet publish .\DesktopCommander.UiBridge\DesktopCommander.UiBridge.csproj -c Release --no-restore -o $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $exe = Join-Path $output 'DesktopCommander.UiBridge.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Published DesktopCommander.UiBridge.exe is missing.'
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Output "UI bridge SHA-256: $hash"
