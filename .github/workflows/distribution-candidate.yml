name: Unpublished Portable Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  JDC_CANDIDATE_INCLUDE_NATIVE: '0'

jobs:
  windows-operator-ui:
    uses: ./.github/workflows/windows-operator-ui-bundle.yml
    with:
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}

  linux-operator-ui:
    uses: ./.github/workflows/linux-operator-ui-bundle.yml
    with:
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}

  portable-candidate:
    needs: [windows-operator-ui, linux-operator-ui]
    name: Candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      JDC_CANDIDATE_TARGET: ${{ matrix.target }}
      JDC_CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up official Node.js 24 runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Exercise deterministic filesystem test barriers and temp fixtures
        run: node --test test/security/controlled-interleaving.test.js

      - name: Build JDC production files
        run: npm run build

      - name: Validate original MCP tool contract
        run: npm run validate:tools:built
        env:
          MCP_INSPECTOR_SECRET_STORE: memory

      - name: Deny filesystem access when authorization config cannot be loaded
        run: node --test test/test-filesystem-policy-fail-closed.js

      - name: Run packaging security regression tests
        run: node --test test/distribution-candidate.test.js test/test-native-portable-gate.js test/test-no-napi-portable-gate.cjs test/test-tunnel-client-release.js test/test-installer-packaging.js test/test-windows-operator-ui-bundle.js

      - name: Keep only locked runtime dependencies
        run: npm prune --omit=dev --ignore-scripts --no-audit --no-fund

      # Unshipped Rust feasibility belongs exclusively to
      # t011-capability-feasibility.yml (Windows/Linux, Node 22/24).
      # This distribution job must prove only the exact packaged Node payload.
      # Do not remove the native deny-only security checks from T011 CI.

      - name: Stage Node runtime without native capability with hashed manifest
        run: node scripts/distribution-candidate.mjs build

      - name: Independently verify staged bytes and provenance
        run: node scripts/distribution-candidate.mjs verify

      - name: Smoke test packaged Node and bundled ripgrep
        run: node scripts/distribution-candidate.mjs smoke

      - name: Create lossless TAR containing hidden files and native permissions
        run: node scripts/distribution-candidate.mjs archive

      - name: Retain unpublished candidate as a short-lived CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-jdc-portable-${{ matrix.target }}
          path: ${{ runner.temp }}/UNPUBLISHED-jdc-portable-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download original uploaded candidate for round-trip acceptance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UNPUBLISHED-jdc-portable-${{ matrix.target }}
          path: ${{ runner.temp }}/jdc-roundtrip-download/

      - name: Verify downloaded TAR and smoke extracted native runtime
        run: node scripts/distribution-candidate.mjs roundtrip

      - name: Real MCP client acceptance outside checkout
        run: node scripts/portable-mcp-e2e.mjs "${{ runner.temp }}/jdc-candidate-roundtrip-${{ matrix.target }}"
      - name: Provision real hosted Linux user manager
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"

      - name: Accept the packaged Linux tunnel lifecycle with real systemd
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          systemctl --user show-environment > /dev/null
          node scripts/linux-user-systemd-e2e.mjs "${{ runner.temp }}/jdc-candidate-roundtrip-${{ matrix.target }}"

      - name: Disable temporary Linux user lingering
        if: ${{ always() && matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl disable-linger "$(id -un)"

      - name: Verify installer provenance
        run: node scripts/validate-installer-input.mjs "${{ runner.temp }}/jdc-candidate-roundtrip-${{ matrix.target }}" "${{ matrix.target }}" "${{ env.JDC_CANDIDATE_SOURCE_SHA }}"

      # Official external binary is downloaded only on disposable CI runners,
      # checked against the pinned upstream SHA-256, then bundled without
      # creating tunnels, credentials, services, or privileged broker routes.
      - name: Stage verified official Windows tunnel client
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'jdc-official-tunnel-client'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'tunnel-client-v0.0.19-windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/openai/tunnel-client/releases/download/v0.0.19/tunnel-client-v0.0.19-windows-amd64.zip' -OutFile $archive
          node scripts/verify-tunnel-client-release.mjs win32-x64 $archive
          if ($LASTEXITCODE -ne 0) { throw 'Official Windows tunnel archive rejected' }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          Remove-Item -LiteralPath $archive
          $version = & (Join-Path $root 'tunnel-client.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^0\.0\.19') { throw 'Official tunnel version mismatch' }

      - name: Stage verified official Linux tunnel client
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jdc-official-tunnel-client"
          mkdir -p "$root"
          archive="$root/tunnel-client-v0.0.19-linux-amd64.zip"
          curl --fail --location --retry 3 --max-time 120 --output "$archive" 'https://github.com/openai/tunnel-client/releases/download/v0.0.19/tunnel-client-v0.0.19-linux-amd64.zip'
          node scripts/verify-tunnel-client-release.mjs linux-x64 "$archive"
          unzip -q "$archive" -d "$root"
          rm "$archive"
          chmod 0755 "$root/tunnel-client" "$root/cloudflared"
          "$root/tunnel-client" --version | grep '^0\.0\.19'

      # Builds are non-release candidates. Release Please alone controls
      # release versions/tags; no workflow here may publish or sign artifacts.
      - name: Download exact Windows operator UI overlay
        if: matrix.target == 'win32-x64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UNPUBLISHED-jdc-operator-ui-win32-x64
          path: ${{ runner.temp }}/jdc-operator-ui

      - name: Download exact Linux operator UI overlay
        if: matrix.target == 'linux-x64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UNPUBLISHED-jdc-operator-ui-linux-x64
          path: ${{ runner.temp }}/jdc-operator-ui-linux

      - name: Compile Inno Setup installer candidate
        if: matrix.target == 'win32-x64'
        shell: pwsh
        env:
          JDC_INSTALLER_SOURCE: ${{ runner.temp }}/jdc-candidate-roundtrip-win32-x64
          JDC_INSTALLER_OUTPUT: ${{ runner.temp }}/jdc-installer-output
          JDC_TUNNEL_CLIENT_SOURCE: ${{ runner.temp }}/jdc-official-tunnel-client
          JDC_OPERATOR_UI_SOURCE: ${{ runner.temp }}/jdc-operator-ui
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/operator-ui-bundle.mjs verify $env:JDC_OPERATOR_UI_SOURCE $env:JDC_CANDIDATE_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI source not verified' }
          $env:JDC_INSTALLER_VERSION = (node -p "require('./package.json').version").Trim()
          $tools = Join-Path $env:RUNNER_TEMP 'inno-pinned'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $pkg = Join-Path $tools 'tools.innosetup.6.7.3.nupkg'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $pkg
          $expected = 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4'
          if ((Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash -ne $expected) { throw 'Inno compiler digest mismatch' }
          $zip = Join-Path $tools 'tools.zip'
          Copy-Item -LiteralPath $pkg -Destination $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $tools 'compiler')
          $compiler = Join-Path $tools 'compiler/tools/ISCC.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $compiler).Status -ne 'Valid') { throw 'Inno compiler signature invalid' }
          New-Item -ItemType Directory -Path $env:JDC_INSTALLER_OUTPUT -Force | Out-Null
          & $compiler /Qp 'packaging/windows/JameDesktopCommander.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

      - name: Verify Windows installer install and uninstall
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version").Trim()
          $setup = Join-Path $env:RUNNER_TEMP "jdc-installer-output/UNPUBLISHED-jdc-installer-win32-x64.exe"
          if (!(Test-Path -LiteralPath $setup)) { throw 'Windows installer missing' }
          $target = Join-Path $env:RUNNER_TEMP 'isolated-installer-acceptance'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C812A487-AF99-4640-9F77-31DD4A9A7F12}_is1'
          $launcher = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\JameDesktopCommander (MCP console).lnk'
          $operatorShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\JameDesktopCommander - Tunnel Operator.lnk'
          # Installation must not add autoruns, environment entries or firewall exceptions.
          # Observe complete native registry/firewall state, but never print their values.
          $startupKeys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          )
          $environmentKeys = @('HKCU:\Environment', 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
          function Get-RegistrySnapshot([string[]]$keys) {
            $snapshot = foreach ($key in $keys) {
              if (!(Test-Path -LiteralPath $key)) { "$key|absent"; continue }
              $values = Get-ItemProperty -LiteralPath $key
              $fields = @($values.PSObject.Properties |
                Where-Object { $_.Name -notin @('PSPath','PSParentPath','PSChildName','PSDrive','PSProvider') } |
                Sort-Object Name | ForEach-Object { $_.Name + '=' + [string]$_.Value })
              $key + '|' + ($fields -join [char]10)
            }
            return ($snapshot -join [char]10)
          }
          function Get-StartupFilesSnapshot {
            $locations = @(
              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup'),
              (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Startup')
            )
            $entries = foreach ($location in $locations) {
              if (!(Test-Path -LiteralPath $location)) { "$location|absent"; continue }
              Get-ChildItem -LiteralPath $location -File -Recurse |
                Sort-Object FullName | ForEach-Object {
                  $_.FullName + '|' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                }
            }
            return ($entries -join [char]10)
          }
          function Get-FirewallSnapshot {
            $rules = @(Get-NetFirewallRule -PolicyStore PersistentStore -ErrorAction Stop |
              Sort-Object Name | ForEach-Object {
                $_.Name + '|' + $_.DisplayName + '|' + $_.Enabled + '|' + $_.Direction + '|' + $_.Action
              })
            $ports = @(Get-NetFirewallPortFilter -PolicyStore PersistentStore -ErrorAction Stop |
              Sort-Object InstanceID | ForEach-Object {
                $_.InstanceID + '|' + $_.Protocol + '|' + ($_.LocalPort -join ',') + '|' + ($_.RemotePort -join ',')
              })
            $applications = @(Get-NetFirewallApplicationFilter -PolicyStore PersistentStore -ErrorAction Stop |
              Sort-Object InstanceID | ForEach-Object { $_.InstanceID + '|' + $_.Program })
            return ((@($rules) + @($ports) + @($applications)) -join [char]10)
          }
          $startupBefore = Get-RegistrySnapshot $startupKeys
          $startupFilesBefore = Get-StartupFilesSnapshot
          $environmentBefore = Get-RegistrySnapshot $environmentKeys
          $firewallBefore = Get-FirewallSnapshot
          function Assert-HostPackageBoundary {
            if ((Get-RegistrySnapshot $startupKeys) -cne $startupBefore -or
                (Get-StartupFilesSnapshot) -cne $startupFilesBefore) {
              throw 'Pre-existing Windows startup registration modified by installer'
            }
            if ((Get-RegistrySnapshot $environmentKeys) -cne $environmentBefore) {
              throw 'Windows environment registration modified by installer'
            }
            if ((Get-FirewallSnapshot) -cne $firewallBefore) {
              throw 'Windows firewall rules modified by installer'
            }
          }
          $taskNamesBefore = @(Get-ScheduledTask | Where-Object { $_.TaskName -match 'JameDesktop|Desktop Commander' } |
            Sort-Object TaskName | ForEach-Object { $_.TaskName + '|' + $_.Actions[0].Execute })
          $servicesBefore = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match 'JameDesktop|DesktopCommander|JDC' } |
            Sort-Object Name | ForEach-Object { $_.Name + '|' + $_.PathName })
          $profileSentinel = Join-Path $env:LOCALAPPDATA 'OpenAI\tunnel-client\profiles\jdc-ci-uninstall-sentinel.txt'
          if (Test-Path $uninstallKey) { throw 'Refusing to overwrite an existing JDC installation' }
          if (Test-Path $profileSentinel) { throw 'Refusing to overwrite existing operator profile' }
          New-Item -ItemType Directory -Path (Split-Path $profileSentinel) -Force | Out-Null
          [IO.File]::WriteAllText($profileSentinel, 'JDC_PREEXISTING_PROFILE_UNTOUCHED')
          $profileHash = (Get-FileHash $profileSentinel -Algorithm SHA256).Hash
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Windows install failed: $($result.ExitCode)" }
          if (!(Test-Path $uninstallKey)) { throw 'Installed JDC uninstall registration missing' }
          $registered = Get-ItemProperty $uninstallKey
          if ($registered.DisplayName -ne 'JameDesktopCommander' -or $registered.DisplayVersion -ne $version) {
            throw 'Windows uninstall registration identity/version mismatch'
          }
          if ([IO.Path]::GetFullPath($registered.InstallLocation).TrimEnd('\') -ine [IO.Path]::GetFullPath($target).TrimEnd('\')) {
            throw 'Windows uninstall registration targets wrong directory'
          }
          if (!(Test-Path $launcher) -or !(Test-Path $operatorShortcut)) {
            throw 'Installed Windows launcher shortcuts missing'
          }
          $tasksAfterInstall = @(Get-ScheduledTask | Where-Object { $_.TaskName -match 'JameDesktop|Desktop Commander' } |
            Sort-Object TaskName | ForEach-Object { $_.TaskName + '|' + $_.Actions[0].Execute })
          if (($tasksAfterInstall -join '|') -ne ($taskNamesBefore -join '|')) {
            throw 'Unexpected JDC Scheduled Task added by installer'
          }
          $servicesAfterInstall = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match 'JameDesktop|DesktopCommander|JDC' } |
            Sort-Object Name | ForEach-Object { $_.Name + '|' + $_.PathName })
          if (($servicesAfterInstall -join '|') -ne ($servicesBefore -join '|')) {
            throw 'Unexpected JDC service added by per-user installer'
          }
          if ((Get-FileHash $profileSentinel -Algorithm SHA256).Hash -ne $profileHash) {
            throw 'Pre-existing tunnel profile modified by installer'
          }
          Assert-HostPackageBoundary
          $runtime = Join-Path $target 'runtime/node.exe'
          if (!(Test-Path -LiteralPath $runtime)) { throw 'Installed runtime missing' }
          & $runtime --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Node execution failed' }
          if (!(Test-Path (Join-Path $target 'dist/index.js'))) { throw 'Installed MCP entrypoint missing' }
          $tunnel = Join-Path $target 'tools/tunnel-client/tunnel-client.exe'
          if (!(Test-Path -LiteralPath $tunnel)) { throw 'Installed tunnel client missing' }
          $tunnelVersion = & $tunnel --version
          if ($LASTEXITCODE -ne 0 -or $tunnelVersion -notmatch '^0\.0\.19') { throw 'Installed tunnel client version mismatch' }
          $gui = Join-Path $target 'jdc-tunnel-operator-ui.exe'
          $uiManifest = Join-Path $target 'operator-ui-manifest.json'
          if (!(Test-Path -LiteralPath $gui -PathType Leaf) -or !(Test-Path -LiteralPath $uiManifest -PathType Leaf)) { throw 'Installed GUI or source manifest missing' }
          node scripts/operator-ui-bundle.mjs verify-installed $target $env:JDC_CANDIDATE_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installed GUI or font notices differ from source candidate' }
          $uiCheck = Start-Process -FilePath $gui -ArgumentList '--check-installation' -WorkingDirectory $target -Wait -PassThru
          if ($uiCheck.ExitCode -ne 0) { throw "Native operator read-only contract rejected: $($uiCheck.ExitCode)" }
          $uninstall = Get-ChildItem -LiteralPath $target -Filter 'unins*.exe' -File | Select-Object -First 1
          if (!$uninstall) { throw 'Expected Inno uninstall executable missing' }
          $result = Start-Process -FilePath $uninstall.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Windows uninstall failed: $($result.ExitCode)" }
          if (Test-Path $uninstallKey) { throw 'JDC uninstall registration remains after uninstall' }
          if (Test-Path $launcher) { throw 'Windows launcher shortcut remains after uninstall' }
          if (Test-Path $operatorShortcut) { throw 'Windows operator shortcut remains after uninstall' }
          if (Test-Path $runtime) { throw 'Installed Node runtime remains after uninstall' }
          if (Test-Path $tunnel) { throw 'Bundled tunnel client remains after uninstall' }
          if (Test-Path (Join-Path $target 'dist/index.js')) { throw 'MCP entrypoint remains after uninstall' }
          if (Test-Path -LiteralPath $target) { throw 'Installer directory remains after uninstall' }
          $tasksAfterUninstall = @(Get-ScheduledTask | Where-Object { $_.TaskName -match 'JameDesktop|Desktop Commander' } |
            Sort-Object TaskName | ForEach-Object { $_.TaskName + '|' + $_.Actions[0].Execute })
          if (($tasksAfterUninstall -join '|') -ne ($taskNamesBefore -join '|')) {
            throw 'Pre-existing JDC Scheduled Task modified by uninstaller'
          }
          $servicesAfterUninstall = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match 'JameDesktop|DesktopCommander|JDC' } |
            Sort-Object Name | ForEach-Object { $_.Name + '|' + $_.PathName })
          if (($servicesAfterUninstall -join '|') -ne ($servicesBefore -join '|')) {
            throw 'Pre-existing JDC Windows service modified by uninstaller'
          }
          if ((Get-FileHash $profileSentinel -Algorithm SHA256).Hash -ne $profileHash) {
            throw 'Pre-existing tunnel profile modified by uninstaller'
          }
          Assert-HostPackageBoundary
          $ownedProcesses = @(Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -and $_.ExecutablePath.StartsWith(
              ($target + [IO.Path]::DirectorySeparatorChar),
              [StringComparison]::OrdinalIgnoreCase)
          })
          if ($ownedProcesses.Count -ne 0) { throw 'JDC process remains after uninstall' }
          Remove-Item -LiteralPath $profileSentinel -Force
          if (Test-Path -LiteralPath $gui) { throw 'GUI remains after uninstall' }
          if (Test-Path -LiteralPath $uiManifest) { throw 'GUI manifest remains after uninstall' }
          if (Test-Path -LiteralPath (Join-Path $target 'licenses/operator-ui')) { throw 'Native UI license notices remain after uninstall' }

      - name: Build nFPM Debian installer candidate
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          JDC_INSTALLER_SOURCE: ${{ runner.temp }}/jdc-candidate-roundtrip-linux-x64
          JDC_INSTALLER_OUTPUT: ${{ runner.temp }}/jdc-installer-output
          JDC_TUNNEL_CLIENT_SOURCE: ${{ runner.temp }}/jdc-official-tunnel-client
          JDC_OPERATOR_UI_SOURCE: ${{ runner.temp }}/jdc-operator-ui-linux
        run: |
          set -euo pipefail
          node scripts/operator-ui-bundle.mjs verify "$JDC_OPERATOR_UI_SOURCE" "$JDC_CANDIDATE_SOURCE_SHA" linux-x64
          JDC_INSTALLER_VERSION="$(node -p "require('./package.json').version")"
          export JDC_INSTALLER_VERSION
          mkdir -p "$RUNNER_TEMP/nfpm-2.48.0" "$JDC_INSTALLER_OUTPUT"
          package="$RUNNER_TEMP/nfpm-2.48.0/nfpm.tar.gz"
          curl --fail --location --retry 3 --max-time 90 \
            --output "$package" \
            'https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz'
          echo '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  '"$package" | sha256sum --check --status
          tar -xzf "$package" -C "$RUNNER_TEMP/nfpm-2.48.0"
          "$RUNNER_TEMP/nfpm-2.48.0/nfpm" package --config packaging/linux/nfpm.yaml \
            --packager deb \
            --target "$JDC_INSTALLER_OUTPUT/UNPUBLISHED-jdc-installer-linux-x64.deb"

      - name: Verify Debian install and remove
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          deb="$RUNNER_TEMP/jdc-installer-output/UNPUBLISHED-jdc-installer-linux-x64.deb"
          # Hash local systemd and environment configuration without printing secrets.
          linux_systemd_snapshot() {
            if [ ! -d "$HOME/.config/systemd/user" ]; then
              printf '%s\n' '<absent>'
            else
              find "$HOME/.config/systemd/user" -mindepth 1 -printf '%y|%m|%u|%g|%p|%l\n' | LC_ALL=C sort
              find "$HOME/.config/systemd/user" -type f -print0 |
                sort -z | xargs -0 -r sha256sum
            fi
          }
          linux_environment_snapshot() {
            for item in "$HOME/.profile" "$HOME/.bashrc" "$HOME/.pam_environment" \
                        "$HOME/.config/environment.d" /etc/environment /etc/profile; do
              if [ -f "$item" ]; then
                stat -c '%n|%a|%U|%G' "$item"
                sha256sum "$item"
              elif [ -d "$item" ]; then
                find "$item" -mindepth 0 -printf '%y|%m|%u|%g|%p|%l\n' | LC_ALL=C sort
                find "$item" -type f -print0 | sort -z | xargs -0 -r sha256sum
              else
                printf '%s|absent\n' "$item"
              fi
            done
          }
          systemd_before="$(linux_systemd_snapshot | sha256sum)"
          environment_before="$(linux_environment_snapshot | sha256sum)"
          assert_linux_host_boundary() {
            if [ "$(linux_systemd_snapshot | sha256sum)" != "$systemd_before" ]; then
              echo 'Pre-existing Linux systemd-user configuration modified' >&2
              exit 1
            fi
            if [ "$(linux_environment_snapshot | sha256sum)" != "$environment_before" ]; then
              echo 'Pre-existing Linux environment configuration modified' >&2
              exit 1
            fi
          }
          if dpkg-deb --ctrl-tarfile "$deb" | tar -tf - |
            grep -E '(^|/)(preinst|postinst|prerm|postrm)$'; then
            echo 'Debian package has unreviewed maintainer hooks' >&2
            exit 1
          fi
          assert_no_linux_package_process() {
            for proc in /proc/[0-9]*/exe; do
              exe="$(readlink "$proc" 2>/dev/null || true)"
              case "$exe" in
                /opt/jame-desktop-commander/*)
                  echo 'Linux installed process remains after package lifecycle' >&2
                  exit 1
                  ;;
              esac
            done
          }
          test "$(dpkg-deb --field "$deb" Architecture)" = 'amd64'
          test "$(dpkg-deb --field "$deb" Version)" = "${version}-1"
          dpkg-deb --contents "$deb" | grep -F '/opt/jame-desktop-commander/runtime/node' >/dev/null
          dpkg-deb --contents "$deb" | grep -F '/usr/bin/jdc' >/dev/null
          dpkg-deb --contents "$deb" | grep -F '/opt/jame-desktop-commander/jdc-tunnel-operator-ui' >/dev/null
          dpkg-deb --contents "$deb" | grep -F '/usr/share/applications/jdc-tunnel-operator.desktop' >/dev/null
          sudo dpkg -i "$deb"
          assert_linux_host_boundary
          assert_no_linux_package_process
          test -x /opt/jame-desktop-commander/runtime/node
          /opt/jame-desktop-commander/runtime/node --version
          test -x /usr/bin/jdc
          test -x /opt/jame-desktop-commander/tools/tunnel-client/tunnel-client
          /opt/jame-desktop-commander/tools/tunnel-client/tunnel-client --version | grep '^0\.0\.19' # Installed tunnel client
          test -x /opt/jame-desktop-commander/jdc-tunnel-operator-ui
          test -f /opt/jame-desktop-commander/operator-ui-manifest.json
          test -f /usr/share/applications/jdc-tunnel-operator.desktop
          node scripts/operator-ui-bundle.mjs verify-installed /opt/jame-desktop-commander "$JDC_CANDIDATE_SOURCE_SHA" linux-x64
          /opt/jame-desktop-commander/jdc-tunnel-operator-ui --check-installation
          sudo dpkg -r jame-desktop-commander
          sudo dpkg --purge jame-desktop-commander
          if dpkg-query -W jame-desktop-commander >/dev/null 2>&1; then
            echo 'Debian package remains registered after purge' >&2
            exit 1
          fi
          if [ -e /opt/jame-desktop-commander ]; then
            echo 'Linux application directory remains after remove' >&2
            exit 1
          fi
          assert_linux_host_boundary
          assert_no_linux_package_process
          test ! -e /usr/bin/jdc
          test ! -e /opt/jame-desktop-commander/jdc-tunnel-operator-ui
          test ! -e /opt/jame-desktop-commander/operator-ui-manifest.json
          test ! -e /usr/share/applications/jdc-tunnel-operator.desktop

      - name: Retain unpublished installer candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-jdc-installer-${{ matrix.target }}
          path: ${{ runner.temp }}/jdc-installer-output/UNPUBLISHED-jdc-installer-${{ matrix.target }}.${{ matrix.target == 'win32-x64' && 'exe' || 'deb' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
