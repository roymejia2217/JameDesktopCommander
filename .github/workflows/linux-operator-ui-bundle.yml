name: Unpublished Linux Operator UI Bundle

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JDC_CANDIDATE_SOURCE_SHA: ${{ inputs.source_commit }}
    steps:
      - name: Checkout exact native operator source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up official Node.js 24 runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Build pinned Linux operator UI with official Rust toolchain
        shell: bash
        env:
          JDC_OPERATOR_UI_SOURCE: ${{ runner.temp }}/jdc-operator-ui-linux
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JDC_CANDIDATE_SOURCE_SHA"
          rustup toolchain install 1.95.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev
          cargo +1.95.0 build --release --locked \
            --manifest-path native/tunnel-operator-ui/Cargo.toml
          binary="$GITHUB_WORKSPACE/native/tunnel-operator-ui/target/release/jdc-tunnel-operator-ui"
          test -f "$binary"
          stage="$JDC_OPERATOR_UI_SOURCE"
          test ! -e "$stage"
          mkdir -p "$stage"
          install -m 0755 "$binary" "$stage/jdc-tunnel-operator-ui"
          metadata="$(cargo +1.95.0 metadata --locked --format-version 1 \
            --manifest-path native/tunnel-operator-ui/Cargo.toml)"
          fonts="$(printf '%s' "$metadata" | jq -er '.packages |
            map(select(.name == "epaint_default_fonts" and
              .version == "0.37.0" and
              .license == "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0")) |
            if length == 1 then .[0].manifest_path else error("Font dependency mismatch") end')"
          fold="$(printf '%s' "$metadata" | jq -er '.packages |
            map(select(.name == "foldhash" and .version == "0.2.0" and .license == "Zlib")) |
            if length == 1 then .[0].manifest_path else error("Hash dependency mismatch") end')"
          font_dst="$stage/licenses/operator-ui/epaint_default_fonts-0.37.0"
          fold_dst="$stage/licenses/operator-ui/foldhash-0.2.0"
          mkdir -p "$font_dst" "$fold_dst"
          font_dir="$(dirname "$fonts")/fonts"
          for notice in Hack-Regular.txt OFL.txt UFL.txt egui-icons.txt emoji-icon-font-mit-license.txt; do
            test -f "$font_dir/$notice"
            cp -- "$font_dir/$notice" "$font_dst/$notice"
          done
          test -f "$(dirname "$fold")/LICENSE"
          cp -- "$(dirname "$fold")/LICENSE" "$fold_dst/LICENSE"
          node scripts/operator-ui-bundle.mjs create "$stage" "$JDC_CANDIDATE_SOURCE_SHA" linux-x64
          node scripts/operator-ui-bundle.mjs verify "$stage" "$JDC_CANDIDATE_SOURCE_SHA" linux-x64

      - name: Retain exact unpublished Linux GUI overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-jdc-operator-ui-linux-x64
          path: ${{ runner.temp }}/jdc-operator-ui-linux/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
