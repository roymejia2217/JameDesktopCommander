name: T011 Capability Feasibility (non-release)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t011-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-probe:
    name: Native probe (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust compiler in CI only
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Require exact committed Rust dependency lock
        run: cargo +1.91.1 metadata --locked --no-deps --format-version 1 --manifest-path native/capability-probe/Cargo.toml

      - name: Install checksum-verified native cargo-deny for Windows and Linux
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none

      - name: Audit locked Rust advisories, licenses and registry provenance
        run: cargo deny --manifest-path native/capability-probe/Cargo.toml check advisories licenses sources

      - name: Build native Rust Node-API addon
        run: cargo +1.91.1 build --locked --release --manifest-path native/capability-probe/Cargo.toml

      - name: Use official Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 22
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Native addon and capability security tests on Node 22
        run: node --test test/security/capability-probe.test.cjs

      - name: Verify restricted capability policy lifecycle on Node 22
        run: node --test --test-concurrency=1 test/security/restricted-capability-policy.test.cjs test/security/restricted-capability-policy-native.test.cjs

      - name: Prove post-authorization directory swap confinement on Node 22
        # Both suites stage/load the same native .node path; Windows locks loaded DLLs.
        run: node --test --test-concurrency=1 test/security/capability-namespace-swap.test.cjs test/security/capability-root-acquisition.test.cjs

      - name: Use official Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 24
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Native addon and capability security tests on Node 24
        run: node --test test/security/capability-probe.test.cjs

      - name: Verify restricted capability policy lifecycle on Node 24
        run: node --test --test-concurrency=1 test/security/restricted-capability-policy.test.cjs test/security/restricted-capability-policy-native.test.cjs

      - name: Prove post-authorization directory swap confinement on Node 24
        # Both suites stage/load the same native .node path; Windows locks loaded DLLs.
        run: node --test --test-concurrency=1 test/security/capability-namespace-swap.test.cjs test/security/capability-root-acquisition.test.cjs

      - name: Preserve unpublished proof and immutable dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-t011-capability-probe-${{ matrix.target }}
          path: |
            native/capability-probe/Cargo.lock
            native/capability-probe/target/release/jdc-capability-probe.node
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
