name: Native Security Tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t011-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-probe:
    name: Native Security (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust compiler in CI only
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy

      - name: Require exact committed Rust dependency lock
        run: cargo +1.91.1 metadata --locked --no-deps --format-version 1 --manifest-path native/capability-probe/Cargo.toml

      - name: Test policy epoch lifecycle and caller denial
        run: cargo +1.91.1 test --locked --manifest-path native/authority-core/Cargo.toml

      - name: Test service identity and fail-closed startup
        run: cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml

      - name: Compile isolated deny-only Windows SCM entry point
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --bin jdc-authority-scm --manifest-path native/authority-service/Cargo.toml

      # Only the disposable SCM acceptance installs/runs these fixtures.
      - name: Compile SCM-origin issued-client security fixture
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --manifest-path native/authority-service/Cargo.toml --bin jdc-authority-scm-issued-proof --bin jdc-authority-scm-issued-client

      - name: Check isolated Windows SCM entry point without compiler warnings
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 clippy --locked --bin jdc-authority-scm --manifest-path native/authority-service/Cargo.toml -- -D warnings

      - name: Check OS identity preflight without compiler warnings
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/authority-service/Cargo.toml -- -D warnings

      - name: Test SQLite epoch transactions and replay behavior
        run: cargo +1.91.1 test --locked --manifest-path native/authority-store/Cargo.toml

      - name: Check SQLite epoch backend without compiler warnings
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/authority-store/Cargo.toml -- -D warnings

      # Non-shipping Windows operator identity observation. SID equality is
      # not interactive consent, credential custody, or permission to rotate.
      - name: Verify read-only Windows operator identity and Task Scheduler evidence
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 test --locked --manifest-path native/tunnel-operator-authority/Cargo.toml

      - name: Check Windows operator preflight without warnings
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/tunnel-operator-authority/Cargo.toml -- -D warnings

      # Disposable local-file fixtures only. Never execute on a workstation,
      # service, real installed tunnel, or real provider credential.
      - name: Test Linux file rotation and crash recovery
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 test --locked --manifest-path native/tunnel-local-rotation/Cargo.toml

      - name: Deny warnings in native Linux local rotation crate
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/tunnel-local-rotation/Cargo.toml -- -D warnings

      - name: Install checksum-verified native cargo-deny for Windows and Linux
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none

      - name: Audit locked Rust advisories, licenses and registry provenance
        run: cargo deny --manifest-path native/capability-probe/Cargo.toml check advisories licenses sources

      - name: Audit isolated service identity dependencies under native policy
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/authority-service/Cargo.toml check advisories licenses sources

      - name: Audit isolated SQLite epoch dependencies under native policy
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/authority-store/Cargo.toml check advisories licenses sources

      - name: Audit locked native local rotation dependencies
        if: matrix.target == 'linux-x64'
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/tunnel-local-rotation/Cargo.toml check advisories licenses sources

      - name: Audit locked Windows operator preflight dependencies
        if: matrix.target == 'win32-x64'
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/tunnel-operator-authority/Cargo.toml check advisories licenses sources

      # This Linux-only proof lives inside the already governed native job.
      # It modifies only the ephemeral GitHub-hosted runner.
      - name: Build deny-only Linux authority binary for declarative service validation
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --manifest-path native/authority-service/Cargo.toml --bin jdc-authority-service

      - name: Build systemd-issued process origin acceptance fixture
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --manifest-path native/authority-service/Cargo.toml --bin jdc-authority-systemd-issued-proof --bin jdc-authority-systemd-issued-client

      - name: Validate Linux service unit and principal provisioning
        id: linux_systemd_provision
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test ! -e /usr/libexec/jdc/jdc-authority-service
          sysusers_file="$(realpath -e -- packaging/experimental/linux/sysusers.d/jdc-authority.conf)"
          # Temporary client principal for the native CI proof, never a production bootstrap.
          client_sysusers_file="$(realpath -e -- packaging/experimental/linux/sysusers.d/jdc-mcp-client.conf)"
          unit_file="$(realpath -e -- packaging/experimental/linux/systemd/jdc-authority.service)"
          systemd-sysusers --dry-run "$sysusers_file"
          systemd-sysusers --dry-run "$client_sysusers_file"
          test -z "$(getent passwd jdc-authority || :)"
          test -z "$(getent group jdc-authority || :)"
          sudo systemd-sysusers "$sysusers_file"
          test -z "$(getent passwd jdc-mcp-client || :)"
          test -z "$(getent group jdc-mcp-client || :)"
          sudo systemd-sysusers "$client_sysusers_file"
          test "$(id -u jdc-authority)" -gt 0
          test "$(id -g jdc-authority)" -gt 0
          test "$(id -u jdc-mcp-client)" -gt 0
          test "$(id -g jdc-mcp-client)" -gt 0
          test "$(id -u jdc-mcp-client)" -ne "$(id -u jdc-authority)"
          test "$(id -g jdc-mcp-client)" -ne "$(id -g jdc-authority)"
          sudo install -D -m 0755 native/authority-service/target/debug/jdc-authority-service /usr/libexec/jdc/jdc-authority-service
          systemd-analyze verify "$unit_file"

      - name: Build Linux identity fixture
        id: linux_identity_fixture
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-service/Cargo.toml

      - name: Build Linux epoch-store fixture
        id: linux_store_fixture
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-store/Cargo.toml

      - name: Lint Linux custody fixture
        id: linux_custody_lint
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-custody-acceptance.sh && bash -n test/security/t011-linux-custody-acceptance.sh

      - name: Test Linux principal isolation and policy rollback rejection
        id: linux_custody_acceptance
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-custody-acceptance.sh

      # Explicitly run the ignored fixture only after sysusers and the real
      # Linux cross-principal custody test succeeded on a disposable runner.
      - name: Test Linux Unix-socket peer credentials
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          log="$(mktemp -p "$RUNNER_TEMP" jdc-linux-peer.XXXXXXXX)"
          trap 'rm -f -- "$log"' EXIT
          cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --lib \
            linux_cross_principal::distinct_os_user_socket_credentials_match_kernel_not_payload \
            -- --ignored --exact --nocapture 2>&1 | tee "$log"
          grep -Fq 'LINUX_DISTINCT_USER_SOCKET_KERNEL_TEST=PASS' "$log"
          grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored;' "$log"

      - name: Use pinned Node 24 for disposable issuer-to-MCP-SDK proof
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install locked MCP SDK for protected issuer acceptance
        id: issued_sdk_dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build real JDC runtime for the protected issuer acceptance
        id: issued_sdk_runtime
        run: npm run build

      # Same-token local prerequisite, not a protected cross-principal or
      # hosted NTFS verdict. Execute the real SDK, not just a compiled test.
      - name: Test Windows inherited SDK mutation channel (local nonrelease)
        id: windows_issuer_connected_sdk_local_mutations
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JDC_T011_NODE = (Get-Command node -ErrorAction Stop).Source
          if (-not [System.IO.Path]::IsPathFullyQualified($env:JDC_T011_NODE)) {
            throw 'E_STORAGE_NODE_PATH_NOT_ABSOLUTE'
          }
          $cases = @(
            @{ Test = 'journaled_mutations::tests::local_windows_real_sdk_issuer_connected_mutation_channel'; Marker = 'T011_WINDOWS_LOCAL_ISSUER_CONNECTED_SDK_MUTATIONS_PASS_NONRELEASE' },
            @{ Test = 'journaled_mutations::tests::local_windows_issued_sdk_cancelled_staged_mutation_never_publishes'; Marker = 'T011_WINDOWS_NATIVE_JOURNAL_CANCELLED_STAGED_SDK_MUTATION_PASS_NONRELEASE' }
          )
          foreach ($case in $cases) {
            $result = @(cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --lib $case.Test -- --ignored --exact --nocapture 2>&1)
            $code = $LASTEXITCODE
            $result | Write-Output
            if ($code -ne 0) { exit $code }
            if (-not ($result -contains $case.Marker) -or
                -not ($result -contains 'T011_WINDOWS_SDK_JOB_EMPTY_PASS_NONRELEASE') -or
                -not ($result -match '^test result: ok[.] 1 passed; 0 failed; 0 ignored;')) {
              throw 'E_STORAGE_LOCAL_ISSUED_SDK_VERDICT_MISSING'
            }
          }

      # Proves actual kernel handoff to a separate native service process.
      # This same-token local proof is not the hosted distinct-principal gate.
      - name: Test Windows issued SDK handoff to separate native service
        id: windows_issuer_connected_sdk_separate_service
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JDC_T011_NODE = (Get-Command node -ErrorAction Stop).Source
          if (-not [System.IO.Path]::IsPathFullyQualified($env:JDC_T011_NODE)) {
            throw 'E_STORAGE_NODE_PATH_NOT_ABSOLUTE'
          }
          $result = @(cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --lib journaled_mutations::tests::local_windows_issuer_hands_channel_to_separate_native_service -- --ignored --exact --nocapture 2>&1)
          $code = $LASTEXITCODE
          $result | Write-Output
          if ($code -ne 0) { exit $code }
          if (-not ($result -contains 'T011_WINDOWS_SEPARATE_NATIVE_SERVICE_SDK_MUTATIONS_PASS_NONRELEASE') -or
              -not ($result -contains 'T011_WINDOWS_SDK_JOB_EMPTY_PASS_NONRELEASE') -or
              -not ($result -match '^test result: ok[.] 1 passed; 0 failed; 0 ignored;')) {
            throw 'E_STORAGE_SEPARATE_NATIVE_SERVICE_VERDICT_MISSING'
          }

      # Run the real SDK against the native journal before the privileged
      # hosted storage proof; no local result counts as admitted-mount evidence.
      - name: Test Linux SDK native mutations and staged cancellation
        id: linux_issued_sdk_local_mutations
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          export JDC_T011_NODE
          JDC_T011_NODE="$(command -v node)"
          [[ "$JDC_T011_NODE" = /* && -x "$JDC_T011_NODE" ]]
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --lib journaled_mutations::tests::local_real_jdc_sdk_to_journaled_native_mutations -- --ignored --exact --nocapture 2>&1 | tee "$log"
          grep -Fxq T011_LINUX_LOCAL_SDK_NATIVE_JOURNAL_EXACT_BYTES_PASS_NONRELEASE "$log"
          grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored;' "$log"
          cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --lib journaled_mutations::tests::local_real_sdk_cancelled_staged_mutation_never_publishes -- --ignored --exact --nocapture 2>&1 | tee "$log"
          grep -Fxq T011_LINUX_REAL_SDK_CANCELLED_BEFORE_COMMIT_PASS_NONRELEASE "$log"
          grep -Fxq T011_LINUX_NATIVE_JOURNAL_CANCELLED_STAGED_SDK_MUTATION_PASS_NONRELEASE "$log"
          grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored;' "$log"

      - name: Test Linux storage isolation and outside-object integrity
        if: matrix.target == 'linux-x64'
        run: |
          shellcheck --severity=warning test/security/t011-linux-storage-domain-acceptance.sh
          bash -n test/security/t011-linux-storage-domain-acceptance.sh
          bash test/security/t011-linux-storage-domain-acceptance.sh

      - name: Lint systemd real-lifecycle acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-systemd-lifecycle-acceptance.sh && bash -n test/security/t011-systemd-lifecycle-acceptance.sh

      - name: Test Linux systemd fail-closed startup
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-systemd-lifecycle-acceptance.sh

      - name: Parse Windows SCM deny-only acceptance script
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-scm-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Test real Windows SDK read and wrong-connector denial
        id: windows_scm_sdk_read
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JDC_T011_NODE_BINARY = (Get-Command node.exe -ErrorAction Stop).Source
          $result = @(cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --bin jdc-authority-scm-issued-proof observation::job_fixture::sdk_read::tests::real_jdc_sdk_fixed_read_and_wrong_connector_denial -- --ignored --exact --nocapture 2>&1)
          $code = $LASTEXITCODE
          $result | Write-Output
          if ($code -ne 0) { exit $code }
          if (-not ($result -match '^test result: ok[.] 1 passed; 0 failed; 0 ignored;')) { throw 'E_SCM_LOCAL_SDK_VERDICT_MISSING' }

      - name: Test Windows SCM service identity and startup denial
        id: windows_scm_acceptance
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-scm-acceptance.ps1

      - name: Build Windows custody fixtures
        id: windows_custody_fixture
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-store/Cargo.toml

      - name: Build test-only Windows named-pipe peer proof
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-service/Cargo.toml

      - name: Test Windows named-pipe peer denial
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 test --locked --example windows_named_pipe_peer_proof --manifest-path native/authority-service/Cargo.toml

      - name: Parse Windows NTFS custody acceptance script
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-custody-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Test Windows NTFS custody and rollback rejection
        id: windows_custody_acceptance
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-custody-acceptance.ps1

      - name: Test Windows storage isolation and outside-object integrity
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-storage-domain-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          pwsh -NoProfile -File test/security/t011-windows-storage-domain-acceptance.ps1

      - name: Build deny-only native Rust Node-API addon
        run: cargo +1.91.1 build --locked --release --manifest-path native/capability-probe/Cargo.toml

      - name: Use official Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 22
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Test Node.js 22.19 native API denial
        id: native_api_node22
        run: node --test test/security/capability-default-surface.test.cjs

      - name: Use official Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 24
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Test Node.js 24 native API denial
        id: native_api_node24
        run: node --test test/security/capability-default-surface.test.cjs

      # Real Windows OS custody + official SDK Client.callTool, non-shipping.
      # A disposable same-SID adversary must be rejected before native bytes
      # are released from a previously opened, issuer-owned file HANDLE.
      - name: Exercise protected Windows-issued MCP SDK exact native read
        id: windows_issued_sdk_native_read
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JDC_T011_NODE_BINARY = (Get-Command node -ErrorAction Stop).Source
          if (-not [System.IO.Path]::IsPathFullyQualified($env:JDC_T011_NODE_BINARY)) {
            throw 'Node executable must be absolute'
          }
          cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml --test windows_guarded_client_pipe protected_issued_sdk_read_preserves_exact_bytes_and_rejects_same_sid -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The historical N-API receiver and hardlink RED probes are retained on
      # research PRs #131/#147. This production-candidate job no longer builds
      # their unsafe class. Do not count those security acceptance gates as passed.
      - name: Lint native API implementation
        id: native_module_lint
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/capability-probe/Cargo.toml -- -D warnings

      - name: Test native denial and API surface
        run: node --test test/security/capability-default-surface.test.cjs

      - name: Verify native proof isolation and dependency lock
        id: native_proof_integrity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-t011-capability-probe-${{ matrix.target }}
          path: |
            native/capability-probe/Cargo.lock
            native/capability-probe/target/release/jdc-capability-probe.node
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
