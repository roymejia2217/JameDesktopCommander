name: T011 Capability Feasibility (non-release)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t011-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-probe:
    name: Native probe (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust compiler in CI only
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy

      - name: Require exact committed Rust dependency lock
        run: cargo +1.91.1 metadata --locked --no-deps --format-version 1 --manifest-path native/capability-probe/Cargo.toml

      - name: Prove sealed epoch lifecycle and external caller denial on native OS
        run: cargo +1.91.1 test --locked --manifest-path native/authority-core/Cargo.toml

      - name: Prove OS service identity preflight and fail-closed startup
        run: cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml

      - name: Install official Rustfmt for pinned Rust toolchain
        run: rustup component add --toolchain 1.91.1 rustfmt

      - name: Verify native authority service Rustfmt (pinned toolchain)
        run: cargo +1.91.1 fmt --manifest-path native/authority-service/Cargo.toml --all -- --check

      - name: Compile isolated deny-only Windows SCM entry point
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --bin jdc-authority-scm --manifest-path native/authority-service/Cargo.toml

      - name: Check isolated Windows SCM entry point without compiler warnings
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 clippy --locked --bin jdc-authority-scm --manifest-path native/authority-service/Cargo.toml -- -D warnings

      - name: Check OS identity preflight without compiler warnings
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/authority-service/Cargo.toml -- -D warnings

      - name: Prove isolated SQLite epoch transactions and replay limitation
        run: cargo +1.91.1 test --locked --manifest-path native/authority-store/Cargo.toml

      - name: Prove real SQLite rollback journal lifecycle on Windows and Linux
        run: cargo +1.91.1 test --locked --example custody_fixture --manifest-path native/authority-store/Cargo.toml

      - name: Prove the unprivileged hardlink attack fixture has a working positive control
        run: cargo +1.91.1 test --locked --example custody_attacker --manifest-path native/authority-store/Cargo.toml

      - name: Check SQLite epoch backend without compiler warnings
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/authority-store/Cargo.toml -- -D warnings

      - name: Install checksum-verified native cargo-deny for Windows and Linux
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none

      - name: Audit locked Rust advisories, licenses and registry provenance
        run: cargo deny --manifest-path native/capability-probe/Cargo.toml check advisories licenses sources

      - name: Audit isolated service identity dependencies under native policy
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/authority-service/Cargo.toml check advisories licenses sources

      - name: Audit isolated SQLite epoch dependencies under native policy
        run: cargo deny --config native/capability-probe/deny.toml --manifest-path native/authority-store/Cargo.toml check advisories licenses sources

      # This Linux-only proof lives inside the already governed native job.
      # It modifies only the ephemeral GitHub-hosted runner.
      - name: Build deny-only Linux authority binary for declarative service validation
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --manifest-path native/authority-service/Cargo.toml --bin jdc-authority-service

      - name: Validate experimental systemd unit and sysusers definition
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test ! -e /usr/libexec/jdc/jdc-authority-service
          sysusers_file="$(realpath -e -- packaging/experimental/linux/sysusers.d/jdc-authority.conf)"
          unit_file="$(realpath -e -- packaging/experimental/linux/systemd/jdc-authority.service)"
          systemd-sysusers --dry-run "$sysusers_file"
          test -z "$(getent passwd jdc-authority || :)"
          test -z "$(getent group jdc-authority || :)"
          test -z "$(getent passwd jdc-mcp-client || :)"
          test -z "$(getent group jdc-mcp-client || :)"
          sudo systemd-sysusers "$sysusers_file"
          test "$(id -u jdc-authority)" -gt 0
          test "$(id -g jdc-authority)" -gt 0
          test "$(id -u jdc-mcp-client)" -gt 0
          test "$(id -u jdc-mcp-client)" != "$(id -u jdc-authority)"
          test "$(id -gn jdc-mcp-client)" = jdc-mcp-client
          sudo install -D -m 0755 native/authority-service/target/debug/jdc-authority-service /usr/libexec/jdc/jdc-authority-service
          systemd-analyze verify "$unit_file"

      - name: Build test-only dedicated identity probe on Linux
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-service/Cargo.toml

      - name: Lint official systemd FD3 activation acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-systemd-fd3-acceptance.sh && bash -n test/security/t011-systemd-fd3-acceptance.sh

      - name: Prove official systemd tool passes the exact named FD3 on Linux
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-systemd-fd3-acceptance.sh

      - name: Test IPC example identity rejection on actual Linux kernel
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 test --locked --examples --manifest-path native/authority-service/Cargo.toml

      - name: Build test-only transactional store fixture on Linux
        if: matrix.target == 'linux-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-store/Cargo.toml

      - name: Lint connected Linux IPC peer acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-ipc-peer-acceptance.sh && bash -n test/security/t011-linux-ipc-peer-acceptance.sh

      - name: Prove connected IPC identity across real Linux principals
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-ipc-peer-acceptance.sh

      - name: Lint Linux cross-principal acceptance fixture
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-custody-acceptance.sh && bash -n test/security/t011-linux-custody-acceptance.sh

      - name: Prove Linux distinct-principal custody and reject database rollback
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-custody-acceptance.sh

      - name: Lint Linux isolated-volume object custody proof
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-storage-domain-acceptance.sh && bash -n test/security/t011-linux-storage-domain-acceptance.sh

      - name: Prove isolated Linux mount denies cross-volume hardlinks
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-storage-domain-acceptance.sh

      - name: Lint Linux protected epoch witness acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-epoch-anchor-acceptance.sh && bash -n test/security/t011-linux-epoch-anchor-acceptance.sh

      - name: Prove root-admin epoch witness under actual Linux service credentials
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-epoch-anchor-acceptance.sh

      - name: Lint Linux admin-owned policy-file custody acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-linux-admin-policy-file-acceptance.sh && bash -n test/security/t011-linux-admin-policy-file-acceptance.sh

      - name: Prove admin-owned policy-file inode custody under Linux service identity
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-linux-admin-policy-file-acceptance.sh

      - name: Lint systemd real-lifecycle acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-systemd-lifecycle-acceptance.sh && bash -n test/security/t011-systemd-lifecycle-acceptance.sh

      - name: Prove Linux systemd service fails closed under its actual OS identity
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-systemd-lifecycle-acceptance.sh

      - name: Lint managed Linux socket custody acceptance
        if: matrix.target == 'linux-x64'
        run: shellcheck --severity=warning test/security/t011-systemd-socket-custody-acceptance.sh && bash -n test/security/t011-systemd-socket-custody-acceptance.sh

      - name: Prove root-managed systemd AF_UNIX socket access and removal
        if: matrix.target == 'linux-x64'
        run: bash test/security/t011-systemd-socket-custody-acceptance.sh

      - name: Parse Windows SCM deny-only acceptance script
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-scm-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Prove Windows SCM virtual account denies startup under its real token
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-scm-acceptance.ps1

      - name: Verify SCM probe verdict separation under Rust unit tests
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 test --locked --example windows_state_scm_probe --manifest-path native/authority-service/Cargo.toml

      - name: Build disposable debug-only SCM policy-state observation probe
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --example windows_state_scm_probe --manifest-path native/authority-service/Cargo.toml

      - name: Parse disposable Windows SCM policy-state acceptance
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-state-scm-positive.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Prove true SCM-restricted token admits only protected state DACL
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-state-scm-positive.ps1

      - name: Verify read-only Windows Registry epoch contract under Rust tests
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 test --locked --manifest-path native/authority-service/Cargo.toml windows_epoch_anchor::tests

      - name: Build disposable debug-only SCM Registry epoch probe
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --example windows_epoch_scm_probe --manifest-path native/authority-service/Cargo.toml

      - name: Parse disposable Windows Registry epoch acceptance
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-registry-epoch-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Prove actual SCM read-only Registry watermark and snapshot rejection
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-registry-epoch-acceptance.ps1

      - name: Build test-only Windows custody fixtures
        if: matrix.target == 'win32-x64'
        run: cargo +1.91.1 build --locked --examples --manifest-path native/authority-store/Cargo.toml

      - name: Parse Windows NTFS custody acceptance script
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-custody-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Prove Windows distinct-principal NTFS custody and reject rollback
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-custody-acceptance.ps1

      - name: Parse temporary NTFS VHD isolation acceptance
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'test/security/t011-windows-storage-domain-acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Prove isolated NTFS volume denies cross-volume hardlinks
        if: matrix.target == 'win32-x64'
        run: pwsh -NoProfile -File test/security/t011-windows-storage-domain-acceptance.ps1

      - name: Build deny-only native Rust Node-API addon
        run: cargo +1.91.1 build --locked --release --manifest-path native/capability-probe/Cargo.toml

      - name: Use official Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0

      - name: Enforce experimental systemd socket declaration on Node 22
        run: node --test test/security/t011-systemd-socket-contract.test.mjs

      - name: Build test-only native C4d parity probe
        run: cargo +1.91.1 build --locked --example c4d_probe --manifest-path native/authority-service/Cargo.toml

      - name: Install locked Node dependencies for C4d parity
        run: npm ci --fund=false

      - name: Compile the original TypeScript C4d validator
        run: npm run build

      - name: Compare exact C4d request admission between Node 22 and native Rust
        run: node --test test/security/c4d-native-parity.test.mjs

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 22
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Verify deny-only native exports on Node 22.19
        run: node --test test/security/capability-default-surface.test.cjs

      - name: Use official Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Compare exact C4d request admission between Node 24 and native Rust
        run: node --test test/security/c4d-native-parity.test.mjs

      - name: Assert byte-for-byte reproducible Cargo.lock on Node 24
        run: node --test test/security/capability-lock-consistency.test.cjs

      - name: Verify deny-only native exports on Node 24
        run: node --test test/security/capability-default-surface.test.cjs

      # The historical N-API receiver and hardlink RED probes are retained on
      # research PRs #131/#147. This production-candidate job no longer builds
      # their unsafe class. Do not count those security acceptance gates as passed.
      - name: Require warning-free deny-only native module
        run: cargo +1.91.1 clippy --locked --all-targets --manifest-path native/capability-probe/Cargo.toml -- -D warnings

      - name: Prove default native artifact denies and exposes no class receivers
        run: node --test test/security/capability-default-surface.test.cjs

      - name: Preserve unpublished proof and immutable dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNPUBLISHED-t011-capability-probe-${{ matrix.target }}
          path: |
            native/capability-probe/Cargo.lock
            native/capability-probe/target/release/jdc-capability-probe.node
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
