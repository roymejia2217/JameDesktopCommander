[package]
name = "jdc-authority-service"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
cap-std = "=4.0.3" # Preopened-directory-only operation; no ambient path API.
cap-fs-ext = "=4.0.3" # OS metadata from the already-open file handle.

[dev-dependencies]
tempfile = "=3.23.0"
same-file = "=1.0.6"
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
jdc-authority-store = { path = "../authority-store", features = ["offline-fixture"] }

[lib]
name = "jdc_authority_service"
path = "src/lib.rs"

[[bin]]
name = "jdc-authority-service"
path = "src/main.rs"

# SCM-compatible deny-only experiment; never packaged or registered on user hosts.
[[bin]]
name = "jdc-authority-scm"
path = "src/windows_scm.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
jdc-authority-store = { path = "../authority-store" }
# Official, version-pinned capget(2) wrapper for Linux thread credentials.
rustix = { version = "=1.1.5", features = ["thread"] }
# Established Rust implementation of the systemd LISTEN_FDS/FNAMES contract.
sd-notify = { version = "=0.5.0", default-features = false }

[target.'cfg(windows)'.dependencies]
jdc-authority-store = { path = "../authority-store" }
windows-service = { version = "=0.8.1" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }
