[package]
name = "jdc-authority-service"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
tempfile = "=3.23.0"

[lib]
name = "jdc_authority_service"
path = "src/lib.rs"

[[bin]]
name = "jdc-authority-service"
path = "src/main.rs"

# SCM-compatible deny-only experiment; never packaged or registered on user hosts.
[[bin]]
name = "jdc-authority-scm"
path = "src/windows_scm.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-service = { version = "=0.8.1" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
