[package]
name = "jdc-authority-service"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
name = "jdc_authority_service"
path = "src/lib.rs"

[[bin]]
name = "jdc-authority-service"
path = "src/main.rs"

# SCM-compatible deny-only experiment; never packaged or registered on user hosts.
[[bin]]
name = "jdc-authority-scm"
path = "src/windows_scm.rs"

# CI-only SCM origin proof; never included in a candidate distribution.
[[bin]]
name = "jdc-authority-scm-issued-proof"
path = "src/windows_scm_issued_proof.rs"

[[bin]]
name = "jdc-authority-scm-issued-client"
path = "src/windows_scm_issued_client.rs"

# CI-only systemd origin fixtures; not a release component or client grant.
[[bin]]
name = "jdc-authority-systemd-issued-proof"
path = "src/linux_systemd_issued_proof.rs"

[[bin]]
name = "jdc-authority-systemd-issued-client"
path = "src/linux_systemd_issued_client.rs"

[dev-dependencies]
jdc-authority-store = { path = "../authority-store" }
sha2 = { version = "=0.11.0", default-features = false }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-service = { version = "=0.8.1" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }
