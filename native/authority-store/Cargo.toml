[package]
name = "jdc-authority-store"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[features]
# Explicit, development-only SQLite fixtures. No production OS authority.
offline-fixture = []

[dependencies]
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "serialize"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.23.0"
same-file = "=1.0.6"
