[package]
name = "jdc-capability-probe"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "jdc_capability_probe"
crate-type = ["cdylib"]

[features]
receiver-test-fixture = []

[dependencies]
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
napi = { version = "=3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.12"

[build-dependencies]
napi-build = "=2.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
