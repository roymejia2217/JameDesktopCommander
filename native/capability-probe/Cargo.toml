[package]
name = "jdc-capability-probe"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "jdc_capability_probe"
crate-type = ["cdylib"]

[dependencies]
cap-std = "=4.0.3"
napi = { version = "=3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "=3.6.12"

[build-dependencies]
napi-build = "=2.6.0"
