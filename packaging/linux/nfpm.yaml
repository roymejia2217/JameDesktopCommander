# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# Release Please owns the version: CI exports JDC_INSTALLER_VERSION from package.json.
# The candidate source must pass validate-installer-input.mjs before packaging.
name: jame-desktop-commander
arch: amd64
platform: linux
version: ${JDC_INSTALLER_VERSION}
release: 1
section: utils
priority: optional
maintainer: JameDesktopCommander maintainers <noreply@github.com>
description: JameDesktopCommander MCP runtime, without privileged native broker
vendor: JameDesktopCommander
homepage: https://github.com/roymejia2217/JameDesktopCommander
license: MIT
depends:
  - libc6 (>= 2.39)
  - libstdc++6
  - libgcc-s1
contents:
  - src: ${JDC_INSTALLER_SOURCE}/
    dst: /opt/jame-desktop-commander
    type: tree
    expand: true
  - src: ./packaging/linux/jdc
    dst: /usr/bin/jdc
    file_info:
      mode: 0755
  - src: ${JDC_TUNNEL_CLIENT_SOURCE}/
    dst: /opt/jame-desktop-commander/tools/tunnel-client
    type: tree
    expand: true
  - src: ${JDC_OPERATOR_UI_SOURCE}/jdc-tunnel-operator-ui
    dst: /opt/jame-desktop-commander/jdc-tunnel-operator-ui
    file_info:
      mode: 0755
  - src: ${JDC_OPERATOR_UI_SOURCE}/operator-ui-manifest.json
    dst: /opt/jame-desktop-commander/operator-ui-manifest.json
  - src: ${JDC_OPERATOR_UI_SOURCE}/licenses/operator-ui/
    dst: /opt/jame-desktop-commander/licenses/operator-ui
    type: tree
    expand: true
  - src: ./packaging/linux/jdc-tunnel-operator.desktop
    dst: /usr/share/applications/jdc-tunnel-operator.desktop
    file_info:
      mode: 0644
